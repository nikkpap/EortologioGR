name: Release + OTA

# Αυτόματο: κάθε push στο main. Αν η έκδοση (versionName στο app/build.gradle.kts)
# δεν έχει βγει ακόμα, φτιάχνει υπογεγραμμένο APK και το δημοσιεύει στα Releases.
# Η εφαρμογή το βρίσκει μόνη της (OTA) και προτείνει «Ενημέρωση».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Πιστοποιητικό της v1.0.0 — η νέα έκδοση ΠΡΕΠΕΙ να έχει το ίδιο για να περνάει από πάνω.
      EXPECTED_CERT_SHA256: '76b4e155a32f4a7863c38deea141cc2175a573db725b00e3eeafa968c120112c'
    steps:
      - uses: actions/checkout@v4

      - name: Ποια έκδοση;
        id: ver
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "Έκδοση: $VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Η v$VER υπάρχει ήδη – τίποτα να γίνει. (Για νέα κυκλοφορία άλλαξε το versionName.)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Έλεγχος secrets
        if: steps.ver.outputs.skip != 'true'
        env:
          A: ${{ secrets.KEYSTORE_BASE64 }}
          B: ${{ secrets.KEYSTORE_PASSWORD }}
          C: ${{ secrets.KEY_ALIAS }}
        run: |
          [ -n "$A" ] || { echo "::error::Λείπει το secret KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)"; exit 1; }
          [ -n "$B" ] || { echo "::error::Λείπει το secret KEYSTORE_PASSWORD"; exit 1; }
          [ -n "$C" ] || { echo "::error::Λείπει το secret KEY_ALIAS"; exit 1; }
          echo "$A" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          gradle-version: '8.11.1'

      - name: Build υπογεγραμμένου APK
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}0
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Έλεγχος ότι είναι το ΙΔΙΟ κλειδί με την εγκατεστημένη εφαρμογή
        if: steps.ver.outputs.skip != 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          [ -n "$APK" ] || { echo "::error::Δεν βγήκε υπογεγραμμένο APK – έλεγξε KEY_ALIAS / κωδικούς"; exit 1; }
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          GOT=$(grep -m1 'SHA-256 digest' certs.txt | awk '{print tolower($NF)}')
          [ "$GOT" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::Άλλο κλειδί υπογραφής ($GOT) – δεν θα εγκαθίσταται πάνω από την υπάρχουσα εφαρμογή"; exit 1; }
          OUT="EortologioGR-v${{ steps.ver.outputs.ver }}-release.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee sha256.txt
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Δημοσίευση στα Releases (από εδώ το παίρνει το OTA)
        if: steps.ver.outputs.skip != 'true'
        run: |
          TAG="v${{ steps.ver.outputs.ver }}"
          SHA=$(cut -d' ' -f1 sha256.txt)
          printf '%s\n\n%s\n\nΕγκαθίσταται πάνω από την προηγούμενη έκδοση (ίδιο κλειδί υπογραφής).\nSHA-256: %s\n' \
            "Εορτολόγιο+ $TAG" "$(git log -1 --pretty=%B | head -20)" "$SHA" > notes.md
          gh release create "$TAG" "$APK_OUT" --target "$GITHUB_SHA" --title "Εορτολόγιο+ $TAG" --notes-file notes.md --latest
