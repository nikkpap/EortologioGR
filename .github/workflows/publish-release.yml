name: Publish signed Android Release

# Τρέχει όταν ανεβαίνει tag v* (π.χ. v1.1.0) ή χειροκίνητα από την καρτέλα Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag έκδοσης (π.χ. v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      EXPECTED_CERT_SHA256: '76:B4:E1:55:A3:2F:4A:78:63:C3:8D:EE:A1:41:CC:21:75:A5:73:DB:72:5B:00:E3:EE:AF:A9:68:C1:20:11:2C'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Λείπει το secret KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signature = same key as v1.0.0 (αλλιώς δεν περνάει πάνω από την παλιά)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          GOT=$(grep -m1 'SHA-256 digest' certs.txt | awk '{print toupper($NF)}' | sed 's/../&:/g; s/:$//')
          echo "Πιστοποιητικό: $GOT"
          [ "$GOT" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::Λάθος κλειδί υπογραφής – η ενημέρωση δεν θα εγκαθίσταται πάνω από τη v1.0.0"; exit 1; }
          VER=${TAG#v}
          cp "$APK" "EortologioGR-v$VER-release.apk"
          sha256sum "EortologioGR-v$VER-release.apk" | tee sha256.txt
          echo "APK_OUT=EortologioGR-v$VER-release.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(cut -d' ' -f1 sha256.txt)
          NOTES="Εορτολόγιο+ $TAG

          • Νέο σύγχρονο UI (φωτεινό/σκοτεινό), ημερολόγιο μήνα
          • Αναζήτηση με κάθε γραφή (Γιώργος / Γεώργιος / Giorgos)
          • Επαφές: ποιος γιορτάζει → «Χρόνια πολλά» με SMS / WhatsApp / Viber
          • Ειδοποίηση με αναβολή (snooze) και κουμπί «Ευχές»
          • Φιλικό στη μπαταρία, διορθώσεις (Αγ. Γεώργιος μετά το Πάσχα, Android 15 κ.ά.)

          Εγκαθίσταται πάνω από την προηγούμενη έκδοση. SHA-256: $SHA"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Εορτολόγιο+ $TAG" --notes "$NOTES"
          gh release upload "$TAG" "$APK_OUT" --clobber
