name: Smoke test (emulator)
on:
  push:
    branches: ['test/**']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [34, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n gr.eortologio.plus/.MainActivity
            sleep 12
            adb shell pidof gr.eortologio.plus && echo "APP_ALIVE" || echo "APP_DEAD"
            adb logcat -d | grep -E "AndroidRuntime|FATAL|Exception|at gr\.eortologio|Caused by" | head -80 || true
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screenshot-${{ matrix.api }}.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.api }}
          path: screenshot-*.png
