name: Build & Release

# push στο main → build → υπογραφή → GitHub Release → οι συσκευές ενημερώνονται (OTA)
# pull request    → μόνο build (έλεγχος)
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Τρέχει την εφαρμογή σε Android emulator: ανοίγει όλες τις οθόνες + ειδοποίηση.
  # Αν κλείσει (crash), ΔΕΝ βγαίνει έκδοση.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/smoke.sh

  build:
    needs: smoke
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # Πιστοποιητικό κλειδιού υπογραφής (από v1.1) — κάθε Release ΠΡΕΠΕΙ να έχει το ίδιο.
      EXPECTED_CERT_SHA256: '4c6357b5c6f63b3427310887b5f3320c13b411cc9396ed4cf3264134a13c5ee1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Έκδοση
        run: |
          BASE=$(grep -oP '^appVersionBase=\K.*' gradle.properties | tr -d '[:space:]')
          echo "VERSION=$BASE.$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Έκδοση: $BASE.$BUILD_NUMBER"

      - name: Build (release, unsigned)
        run: gradle --no-daemon :app:assembleRelease

      - name: Θα βγει Release;
        id: gate
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then go=false; echo "Pull request → μόνο έλεγχος."; fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then go=false; fi
          if printf '%s' "$MSG" | grep -q '\[no release\]'; then go=false; echo "[no release] στο μήνυμα → χωρίς έκδοση."; fi
          if [ "$go" = true ] && [ -z "$KS" ]; then
            go=false
            echo "::warning::Λείπει το secret SIGNING_KEYSTORE_BASE64 → build χωρίς Release. Settings → Secrets and variables → Actions."
          fi
          echo "release=$go" >> "$GITHUB_OUTPUT"

      - name: Υπογραφή + έλεγχος κλειδιού
        if: steps.gate.outputs.release == 'true'
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          [ -n "$KS_PASS" ] || { echo "::error::Λείπει το secret SIGNING_STORE_PASSWORD (κωδικός του .p12)"; exit 1; }
          printf '%s' "$KS" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          OUT="EortologioGR-v$VERSION.apk"
          ARGS=(--ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:KS_PASS)
          [ -n "$KEY_ALIAS" ] && ARGS+=(--ks-key-alias "$KEY_ALIAS")
          if [ -n "$KEY_PASS" ]; then ARGS+=(--key-pass env:KEY_PASS); else ARGS+=(--key-pass env:KS_PASS); fi
          "$BT/apksigner" sign "${ARGS[@]}" --out "$OUT" aligned.apk
          rm -f "$RUNNER_TEMP/release.p12"
          "$BT/apksigner" verify --print-certs "$OUT" | tee certs.txt
          GOT=$(grep -m1 'SHA-256 digest' certs.txt | awk '{print tolower($NF)}')
          [ "$GOT" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::Άλλο κλειδί ($GOT) — δεν θα εγκαθίσταται πάνω από την υπάρχουσα εφαρμογή. Έλεγξε το secret."; exit 1; }
          mkdir -p dist && mv "$OUT" dist/ && (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: GitHub Release (από εδώ το παίρνει το OTA)
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # Σημειώσεις = μήνυμα commit χωρίς τεχνικές γραμμές (Co-Authored-By κ.λπ.)
          printf '%s\n' "${MSG:-Νέα έκδοση}" | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):|claude\.ai/code|Generated with' > notes.md || true
          [ -s notes.md ] || echo "Νέα έκδοση" > notes.md
          # Καθάρισμα και παλιών εκδόσεων
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name'); do
            body=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$t" --jq .body)
            clean=$(printf '%s\n' "$body" | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):|claude\.ai/code|Generated with' || true)
            if [ "$body" != "$clean" ]; then gh release edit "$t" --notes "$clean"; fi
          done
          gh release create "v$VERSION" dist/EortologioGR-v$VERSION.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Εορτολόγιο+ v$VERSION" --notes-file notes.md --latest

      - name: Build χωρίς Release → APK ως artifact
        if: steps.gate.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EortologioGR-unsigned-${{ env.VERSION }}
          path: app/build/outputs/apk/release/*.apk
